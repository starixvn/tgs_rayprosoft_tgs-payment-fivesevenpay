apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "fiveseven-pay.fullname" . }}
  labels:
    {{- include "fiveseven-pay.labels" . | nindent 4 }}
data:
  appsettings.json: | 
    {  
      "FiveSevenPay": {
        "PaymentServiceBaseUrl": "http://payment-api"
      },
      "Logging": {
        "LogLevel": {
          "Microsoft.AspNetCore.HttpLogging": "Information",
          "Tgs.Payment.FiveSevenPay.FiveSevenPayOptions": "Information"
        }
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
    
    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "{{ .Release.Name }}"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
        
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]     
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
    